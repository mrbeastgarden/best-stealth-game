<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Vault — a stealth game</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #070a13;
    color: #e6e9f2;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px 12px 24px;
  }
  header {
    width: 960px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.14em;
    color: #ffd250;
  }
  header .sub { font-size: 13px; color: #9aa3b8; }
  #hud {
    width: 960px;
    max-width: 100%;
    display: flex;
    gap: 16px;
    align-items: center;
    background: #12172a;
    border: 1px solid #26304d;
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 8px;
    font-size: 14px;
    flex-wrap: wrap;
  }
  #hud .stat b { color: #ffd250; }
  #hud .meter {
    flex: 1 1 160px;
    min-width: 140px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #hud .meter .track {
    display: block;
    height: 12px;
    background: #0b0e1a;
    border: 1px solid #26304d;
    border-radius: 6px;
    overflow: hidden;
  }
  #detection-bar {
    display: block;
    height: 100%;
    width: 0%;
    background: #39d98a;
    transition: width 0.1s linear;
  }
  #detection-label { font-size: 12px; color: #9aa3b8; }
  #hud-relic { color: #ffd250; }
  canvas {
    display: block;
    width: 960px;
    max-width: 100%;
    height: auto;
    border: 1px solid #26304d;
    border-radius: 8px;
    background: #0b0e1a;
    image-rendering: auto;
  }
  footer {
    width: 960px;
    max-width: 100%;
    margin-top: 8px;
    font-size: 13px;
    color: #9aa3b8;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  #tip {
    width: 960px;
    max-width: 100%;
    margin-top: 8px;
    font-size: 13px;
    color: #ffd250;
    text-align: center;
    min-height: 18px;
  }
  footer kbd {
    background: #1e2436;
    border: 1px solid #3a4568;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 12px;
    color: #e6e9f2;
  }
  #errors { display: none; }
</style>
</head>
<body>
<header>
  <h1>SHADOW VAULT</h1>
  <span class="sub">A night thief in the Blackwood Museum</span>
</header>
<div id="hud">
  <span class="stat" id="hud-level">Level 1 — The Gallery</span>
  <span class="stat">Time <b id="hud-time">00:00</b></span>
  <span class="stat">Best <b id="hud-best">--:--</b></span>
  <span class="meter">
    <span id="detection-label">Unseen</span>
    <span class="track"><span id="detection-bar"></span></span>
  </span>
  <span id="hud-relic">Relic: find the gold diamond</span>
  <span class="stat" id="hud-alarms">Alarms: 0</span>
  <span class="stat" id="hud-mute">Sound: on (M)</span>
</div>
<canvas id="game" width="960" height="624"></canvas>
<div id="tip"><span id="hud-tip"></span></div>
<footer>
  <span><kbd>W A S D</kbd> / <kbd>← ↑ ↓ →</kbd> move &nbsp;·&nbsp; <kbd>Shift</kbd> run (loud!) &nbsp;·&nbsp; Click — walk here</span>
  <span><kbd>R</kbd> restart &nbsp;·&nbsp; <kbd>Esc</kbd> pause &nbsp;·&nbsp; <kbd>M</kbd> mute</span>
</footer>
<pre id="errors"></pre>
<script type="module" src="src/main.js"></script>
</body>
</html>
